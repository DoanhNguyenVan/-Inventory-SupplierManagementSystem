services:
  - type: web
    name: isms-inventory
    runtime: docker
    branch: main
    plan: free
    region: singapore
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:ismsdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
      - key: SPRING_DATASOURCE_DRIVER
        value: org.h2.Driver
