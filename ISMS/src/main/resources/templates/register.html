<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Inventory & Supplier Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-person-plus fs-4"></i>
            </div>
            <h3>Create an Account</h3>
            <p>Join ISMS to manage your inventory and suppliers</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="POST">
            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label for="fullName" class="form-label fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-card-text text-muted"></i></span>
                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="John Doe" required autofocus>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="johndoe" required>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="john@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label fw-semibold">System Role</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-shield-lock text-muted"></i></span>
                    <select class="form-select" id="role" th:field="*{role}">
                        <option value="STAFF">Staff (Warehouse / Inventory)</option>
                        <option value="USER">Standard User</option>
                        <option value="ADMIN">Administrator</option>
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Min 6 chars" required minlength="6">
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-check-circle text-muted"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required>
                    </div>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label text-muted small" for="termsCheck">
                    I agree to the terms of inventory system usage
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                Register Account
            </button>

            <div class="text-center mt-3">
                <span class="text-muted small">Already have an account? </span>
                <a th:href="@{/login}" class="fw-semibold text-decoration-none">Sign In</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
