<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers - Inventory Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 bg-dark sidebar p-3">
            <div class="d-flex align-items-center mb-4 text-white">
                <i class="bi bi-boxes fs-4 me-2 text-primary"></i>
                <h4 class="brand-title mb-0">ISMS</h4>
            </div>
            <ul class="nav flex-column mb-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/dashboard}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/products}"><i class="bi bi-box-seam"></i> Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white active" th:href="@{/suppliers}"><i class="bi bi-truck"></i> Suppliers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/stock}"><i class="bi bi-arrow-left-right"></i> Stock Movements</a>
                </li>
            </ul>
            <div class="mt-auto pt-4 border-top border-secondary text-white" th:if="${user != null}">
                <div class="d-flex align-items-center mb-3">
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-2 fw-bold" 
                         style="width: 40px; height: 40px;" th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">U</div>
                    <div class="overflow-hidden">
                        <div class="fw-semibold text-truncate" th:text="${user.fullName ?: user.username}">User</div>
                        <small class="badge bg-secondary" th:text="${user.role}">USER</small>
                    </div>
                </div>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm w-100"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </nav>
        <main class="col-md-9 col-lg-10 p-4">
            <h2 class="fw-bold mb-1">Suppliers</h2>
            <p class="text-muted">Manage suppliers in SQL Server database</p>
            <div class="card p-4 mt-3">
                <div class="alert alert-info mb-0">
                    <i class="bi bi-info-circle me-1"></i> Bảng <code>suppliers</code> đã được khởi tạo trong <strong>SQL Server</strong> theo cấu trúc: <code>supplier_id</code> (PK), <code>supplier_name</code>, <code>email</code>, <code>phone</code>.
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
