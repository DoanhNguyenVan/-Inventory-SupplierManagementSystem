<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory & Supplier Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-boxes fs-4"></i>
            </div>
            <h3>Welcome Back</h3>
            <p>Sign in to your ISMS inventory account</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label fw-semibold mb-0">Password</label>
                </div>
                <div class="input-group mt-1">
                    <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                </div>
                <small class="text-muted">Default: <strong>admin</strong> / <strong>admin123</strong></small>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                Sign In
            </button>

            <div class="text-center mt-3">
                <span class="text-muted small">Don't have an account? </span>
                <a th:href="@{/register}" class="fw-semibold text-decoration-none">Create Account</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const pwdInput = document.getElementById("password");
        const toggleIcon = document.getElementById("toggleIcon");
        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener("click", function () {
                if (pwdInput.type === "password") {
                    pwdInput.type = "text";
                    toggleIcon.classList.replace("bi-eye", "bi-eye-slash");
                } else {
                    pwdInput.type = "password";
                    toggleIcon.classList.replace("bi-eye-slash", "bi-eye");
                }
            });
        }
    });
</script>
</body>
</html>
