<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Movements - Inventory Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 bg-dark sidebar p-3">
            <h4 class="text-white">Inventory</h4>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white" href="index.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="products.html">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="suppliers.html">Suppliers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white active" href="stock.html">Stock Movements</a>
                </li>
            </ul>
        </nav>



        <main class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h2>Stock Movements</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStockModal">
                    Add Stock Movement
                </button>
            </div>
            <p>Manage stock in and stock out</p>
            <div class="card p-3 mt-4">
                <input type="text" class="form-control mb-3" placeholder="Search stock movements...">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Quantity Change</th>
                            <th>Movement Date</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="stockTableBody">
                        </tbody>

                        <!--This is where stocks are shown. There must be a delete and edit button-->

                        <!--EXAMPLE STOCK MOVEMENT-->
                        <!--                        <tr>-->
                        <!--                            <td>1</td>-->
                        <!--                            <td>Product A</td>-->
                        <!--                            <td>+5</td>-->
                        <!--                            <td>01/01/2026</td>-->
                        <!--                            <td>-->
                        <!--                                <button class="btn btn-warning btn-sm">Edit</button>-->
                        <!--                                <button class="btn btn-danger btn-sm">Delete</button>-->
                        <!--                            </td>-->
                        <!--                        </tr>-->


                    </table>
                </div>

            </div>
        </main>


        <div class="modal fade" id="addStockModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Add Stock Movement</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal">
                        </button>
                    </div>

                    <div class="modal-body">
                        <form id="addStockForm">

                            <div class="mb-3">
                                <label class="form-label">Product</label>
                                <select class="form-select" name="product_id" required>
                                    <option value="">Select Product</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Quantity Change</label>
                                <input type="number" class="form-control" name="quantity_change" step="1" required>
                                <div class="form-text">
                                    Positive = Stock In, Negative = Stock Out
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Movement Date</label>
                                <input type="datetime-local" class="form-control" name="movement_date" required>
                            </div>

                            <button type="submit" class="btn btn-primary">Save Movement</button>

                        </form>
                    </div>

                </div>
            </div>
        </div>



    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/stock.js"></script>
</body>
</html>
