<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Inventory Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 bg-dark sidebar p-3">
            <h4 class="text-white">Inventory</h4>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white"
                       href="index.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white"
                       href="products.html">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white"
                       href="suppliers.html">Suppliers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white"
                       href="stock.html">Stock Movements</a>
                </li>
            </ul>
        </nav>

        <main class="col-md-9 col-lg-10 p-4">
            <h2>Dashboard</h2>
            <p>Welcome to Inventory Management System</p>

            <div class="row g-3 mt-3">

                        <h5>Total Products</h5>
                        <h2>120</h2>
                    </div>
                </div>

                <div class="col-md-4">

                        <h5>Total Suppliers</h5>
                        <h2>15</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3">
