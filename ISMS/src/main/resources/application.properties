spring.application.name=ISMS
server.port=8080

# ===================================================================
# SQL SERVER DATASOURCE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ISMS_DB;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456

# ===================================================================
# JPA / HIBERNATE CONFIGURATION FOR SQL SERVER
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# THYMELEAF CONFIGURATION (SPRING MVC VIEW RESOLVER)
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8